<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Finder &amp; Keeper mark: a mounted specimen sheet with the spider's thread</title>
  <!-- Folio cloth ground -->
  <rect width="256" height="256" rx="28" fill="#35503a"/>
  <!-- Mounting sheet, slightly turned -->
  <g transform="rotate(-4 128 136)">
    <rect x="62" y="52" width="132" height="172" fill="#efe9da" stroke="#2a2a26" stroke-width="3"/>
    <!-- Linen tape across the top corners -->
    <rect x="52" y="64" width="34" height="11" fill="#e3dcc4" stroke="#b9ad8c" stroke-width="2" transform="rotate(-45 69 69)"/>
    <rect x="170" y="64" width="34" height="11" fill="#e3dcc4" stroke="#b9ad8c" stroke-width="2" transform="rotate(45 187 69)"/>
    <!-- Pressed leaf: the specimen -->
    <path d="M128 196 C 124 160, 118 128, 128 92" fill="none" stroke="#35503a" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 150 C 100 148, 92 124, 100 110 C 118 112, 130 128, 128 150 Z" fill="#4a6a4f" stroke="#2a2a26" stroke-width="2"/>
    <path d="M128 128 C 156 126, 164 102, 156 88 C 138 90, 126 106, 128 128 Z" fill="#35503a" stroke="#2a2a26" stroke-width="2"/>
    <path d="M128 172 C 104 170, 96 148, 104 136 C 120 138, 130 152, 128 172 Z" fill="#35503a" stroke="#2a2a26" stroke-width="2"/>
    <!-- Collector's label -->
    <rect x="76" y="186" width="104" height="26" fill="#fbf8ef" stroke="#2a2a26" stroke-width="2"/>
    <line x1="84" y1="196" x2="150" y2="196" stroke="#2a2a26" stroke-width="2"/>
    <line x1="84" y1="204" x2="130" y2="204" stroke="#2a2a26" stroke-width="2"/>
    <!-- The red stamp: full text checked -->
    <circle cx="166" cy="199" r="7" fill="none" stroke="#9c3b2c" stroke-width="2.5"/>
    <circle cx="166" cy="199" r="2.5" fill="#9c3b2c"/>
  </g>
  <!-- The spider on its thread, coming down from the corner -->
  <line x1="214" y1="0" x2="214" y2="56" stroke="#efe9da" stroke-width="2"/>
  <g transform="translate(214 66)">
    <ellipse cx="0" cy="2" rx="9" ry="10" fill="#2a2a26"/>
    <circle cx="0" cy="-8" r="5.5" fill="#2a2a26"/>
    <circle cx="-2" cy="-9" r="1.4" fill="#efe9da"/><circle cx="2" cy="-9" r="1.4" fill="#efe9da"/>
    <g fill="none" stroke="#2a2a26" stroke-width="2.2" stroke-linecap="round">
      <path d="M-7 -4 L-17 -12 L-22 -4"/><path d="M-8 0 L-19 -2 L-24 6"/><path d="M-8 4 L-18 8 L-22 16"/><path d="M-6 8 L-13 15 L-14 22"/>
      <path d="M7 -4 L17 -12 L22 -4"/><path d="M8 0 L19 -2 L24 6"/><path d="M8 4 L18 8 L22 16"/><path d="M6 8 L13 15 L14 22"/>
    </g>
  </g>
</svg>
