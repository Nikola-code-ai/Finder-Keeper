# Optional migration rehearsal. The normal local app needs neither Docker nor PostgreSQL.
name: finder-keeper-database
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: finder_keeper
      POSTGRES_USER: finder_keeper
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - library_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finder_keeper -d finder_keeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 1
    restart: "no"
volumes:
  library_postgres:
